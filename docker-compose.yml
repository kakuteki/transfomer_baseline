version: '3.8'

services:
  transformer:
    build: .
    container_name: transformer_baseline
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
      - AUTO_RESUME=true
    stdin_open: true
    tty: true
    restart: on-failure  # unless-stopped だと学習を正常に終えても再起動し、最終評価を延々くり返す
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '8gb'
